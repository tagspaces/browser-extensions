<!doctype html>
<html>
  <head>
    <title data-i18n="optionsTitle">TagSpaces Web Clipper Options</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <form id="form">
      <label>
        <input type="checkbox" name="enableScreenshotEmbedding" />
        <span data-i18n="optionsScreenshotEmbedding"
          >Enable embedding a web page screenshot in URL and HTML
          files.</span> </label
      ><br />
      <label>
        <input type="checkbox" name="enableFrontMatter" />
        <span data-i18n="optionsFrontMatter"
          >Add YAML front matter (URL, date, tags) to saved Markdown
          files.</span> </label
      ><br />
      <label>
        <input type="checkbox" name="enableImageDataUrl" />
        <span data-i18n="optionsImageDataUrl"
          >Embed images as data URLs in saved HTML and Markdown
          files.</span> </label
      ><br />
      <label>
        <input type="checkbox" name="enableAutoTagging" />
        <span data-i18n="optionsAutoTagging"
          >Auto-extract tags from page metadata into the tags
          field.</span> </label
      ><span title="experimental feature">🧪</span><br />
      <!-- <label>
        <input type="checkbox" name="enableOpenLocationCode" />
        Enable Plus Codes (open location codes) for geo tagging.
      </label> -->
    </form>
    <br />
    <center>
      <nobr>
        <a
          href="https://www.tagspaces.org/legal/agplv3/"
          target="_blank"
          data-i18n="optionsLicenseLink"
          >License</a
        >&nbsp;
        <a
          href="https://www.tagspaces.org/legal/privacy-webclipper/"
          target="_blank"
          data-i18n="optionsPrivacyLink"
          >Privacy Policy</a
        >&nbsp;
        <a
          href="https://docs.tagspaces.org/web-clipper/"
          target="_blank"
          data-i18n="optionsTutorialLink"
          >Tutorial</a
        >
      </nobr>
    </center>
    <script src="vendor/browser-polyfill.js"></script>
    <script src="options.dist.js"></script>
  </body>
</html>
