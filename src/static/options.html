<!doctype html>
<html>
  <head>
    <title>TagSpaces Web Clipper Options</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <form id="form">
      <label>
        <input type="checkbox" name="enableScreenshotEmbedding" />
        Enable embedding a web page screenshot in URL and HTML files. </label
      ><br />
      <label>
        <input type="checkbox" name="enableFrontMatter" />
        Add YAML front matter (URL, date, tags) to saved Markdown files. </label
      ><br />
      <label>
        <input type="checkbox" name="enableImageDataUrl" />
        Embed images as data URLs in saved HTML and Markdown files. </label
      ><br />
      <label>
        <input type="checkbox" name="enableAutoTagging" />
        Auto-extract tags from page metadata into the tags field. </label
      ><span title="experimental feature">🧪</span><br />
      <!-- <label>
        <input type="checkbox" name="enableOpenLocationCode" />
        Enable Plus Codes (open location codes) for geo tagging.
      </label> -->
    </form>
    <br />
    <center>

          >License</a

          >Tutorial</a

      </nobr>
    </center>
    <script src="vendor/browser-polyfill.js"></script>
    <script src="options.dist.js"></script>
  </body>
</html>
