<!DOCTYPE html>
<html style="overflow: overlay">
  <head lang="en">
    <meta charset="UTF-8" />
    <title>TagSpaces Web Clipper</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
  </head>
  <body
    style="
      width: 540px;
      padding: 10px;
      font-size: 14px;
      background-color: #f9f9f9;
      overflow-x: hidden;
    "
  >
    <div
      class="well"
      style="
        margin: 0;
        padding-bottom: 0;
        border: 0px;
        background-color: transparent;
      "
    >
      <div style="white-space: nowrap; text-align: center">
        <a
          href="https://www.tagspaces.org/?utm_source=webclipper"
          style="text-decoration: none"
          target="_blank"
        >
          <img
            src="images/icon-128.png"
            style="margin-left: 0px; max-height: 22px; max-width: 22px"
          />
          <img src="images/web-clipper-logo.svg" style="height: 25px" />
        </a>

        <a href="#" class="btn btn-link pull-right btn-sm" id="closePopup">
          <i class="closeIcon"></i>
        </a>
      </div>
      <div class="container" style="padding: 0">
        <span class="badge text-bg-secondary">1</span
        ><span data-i18n="previewLabel">Preview</span>
        <div
          id="contentModeSwitch"
          class="btn-group btn-group-sm"
          style="float: right"
          role="group"
          aria-label="Extraction type"
        >
          <button
            id="simplifiedPreview"
            type="button"
            class="btn btn-outline btn-sm"
          >
            simplified
          </button>
          <button id="fullPreview" type="button" class="btn btn-outline btn-sm">
            full
          </button>
        </div>
      </div>
      <iframe id="preview"></iframe>
      <div class="form-group">
        <label class="control-label" for="title">
          <span class="badge text-bg-secondary">2</span>
          <span data-i18n="editTitleLabel"></span>
        </label>
        <input
          class="form-control form-control-sm"
          type="text"
          name="title"
          id="title"
          autocomplete="off"
        />
      </div>
      <div class="form-group">
        <label class="control-label" for="tags">
          <span class="badge text-bg-secondary">3</span>
          <span data-i18n="addTagLabel"></span>
        </label>
        <input
          class="form-control form-control-sm"
          type="text"
          name="tags"
          id="tags"
          value=""
          autocomplete="off"
        />
        <p
          class="help-block"
          style="font-size: 12px; margin-top: 0px; margin-bottom: 0px"
          data-i18n="addTagHelp"
        ></p>
      </div>
      <label>
        <span class="badge text-bg-secondary">4</span>
        <span data-i18n="saveFileLabel"></span>
      </label>
      <div class="row row-cols-2" id="savingActionsArea">
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="saveWholePageAsHtml"
            data-i18n-title="savePageAsHtmlTitle"
          >
            <i class="saveAsHTMLIcon"></i>&nbsp;
            <span data-i18n="savePageAsHtmlLabel"></span>
            <div
              id="saveAsHTMLSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="saveAsMhtml"
            data-i18n-title="saveAsMhtmlTitle"
          >
            <i class="saveAsMHTMLIcon"></i>&nbsp;
            <span data-i18n="saveAsMhtmlLabel"></span>
            <div
              id="saveAsMhtmlSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="saveSelectionAsHtml"
            data-i18n-title="saveSelectionAsHtmlTitle"
          >
            <i class="saveSelectionAsHtmlIcon"></i>&nbsp;
            <span data-i18n="saveAsSelectionLabel"></span>
            <div
              id="saveSelectionAsHtmlSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="saveScreenshot"
            data-i18n-title="saveScreenshotTitle"
          >
            <i class="saveScreenshotIcon"></i>&nbsp;
            <span data-i18n="saveScreenshotLabel"></span>
            <div
              id="saveScreenshotSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="saveAsBookmark"
            data-i18n-title="saveBookmarkTitle"
          >
            <i class="saveBookmarkIcon"></i>&nbsp;
            <span data-i18n="saveBookmarkLabel"></span>
            <div
              id="saveBookmarkSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
        <div class="col">
          <a
            href="#"
            class="btn btn-primary"
            id="downloadFile"
            data-i18n-title="downloadTitle"
          >
            <i class="downloadIcon"></i>&nbsp;
            <span data-i18n="downloadLabel"></span>
            <div
              id="downloadSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            >
              <span class="visually-hidden">Saving...</span>
            </div>
          </a>
        </div>
      </div>
      <label>
        <span class="badge text-bg-secondary">5</span>
        <span data-i18n="desktopTagSpacesLabel"></span>
        <a
          href="https://www.tagspaces.org/?utm_source=webclipper"
          target="_blank"
          >tagspaces.org</a
        >.
      </label>
    </div>
    <script src="./vendor/FileSaver.min.js" type="text/javascript"></script>
    <script src="./vendor/purify.min.js" type="text/javascript"></script>
    <script src="./vendor/openlocationcode.js" type="text/javascript"></script>
    <script src="./popup.dist.js" type="text/javascript"></script>
  </body>
</html>
